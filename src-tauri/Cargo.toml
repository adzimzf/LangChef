[package]
name = "langchef"
version = "0.1.0"
edition = "2021"
description = "LangChef Tauri v2 application"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart", "blocking"], default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros"] }
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4" }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
rand = "0.8"
lindera = { path = "../lindera/lindera" }
flate2 = "1"
tar = "0.4"
fsrs = "5.2.0"
tauri-plugin-notification = "2"
tauri-plugin-background-service = "0.7"
async-trait = "0.1"
# Offline Japanese voice (tts.rs). ONNX Runtime is loaded at run time (`load-dynamic`), never linked or fetched at build time.
piper-plus = { version = "=0.5.3", default-features = false, features = ["onnx", "japanese"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
jpreprocess-dictionary = "=0.9.1"
jpreprocess-dictionary-builder = "=0.9.1"
lindera-core = "0.30"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
oauth2 = { version = "5", features = ["reqwest-blocking"] }
url = "2.5"
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
# systemstat 0.2.6 includes linux.rs for Android but gates procfs for Linux only.
# This local copy extends the procfs cfg to include android.
systemstat = { path = "patches/systemstat" }
