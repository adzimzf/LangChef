[package]
name = "langchef"
version = "0.1.0"
edition = "2021"
description = "LangChef Tauri v2 application"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart", "blocking"], default-features = false }
tokio = { version = "1", features = ["sync"] }
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4" }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
rand = "0.8"
lindera = { path = "../../lindera/lindera", features = ["embed-ipadic"] }
fsrs = "5.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
oauth2 = { version = "5", features = ["reqwest-blocking"] }
url = "2.5"
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
